<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeopardy Trivia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Home -->
        <div id="home-screen" class="screen active">
            <h1>Jeopardy Trivia</h1>
            <p class="subtitle">Juego de preguntas y respuestas</p>
            <div class="home-actions">
                <button id="create-room-btn" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Crear Sala
                </button>
                <button id="join-room-btn" class="btn btn-secondary">
                    <i class="fas fa-sign-in-alt"></i> Unirse
                </button>
            </div>
            <div id="join-form" class="hidden">
                <input type="text" id="room-code" placeholder="Código de sala">
                <input type="text" id="join-player-name" placeholder="Tu nombre">
                <div class="form-actions">
                    <button id="join-room-submit" class="btn btn-primary">Entrar</button>
                    <button id="cancel-join" class="btn btn-text">Cancelar</button>
                </div>
            </div>
        </div>

        <!-- Setup -->
        <div id="setup-screen" class="screen">
            <h2>Configuración</h2>
            <div class="setup-form">
                <div class="field">
                    <label>Categorías</label>
                    <input type="number" id="categories" min="2" max="8" value="5">
                </div>
                <div class="field">
                    <label>Preguntas por categoría</label>
                    <input type="number" id="questions" min="2" max="10" value="5">
                </div>
            </div>
            <div class="actions">
                <button id="back-to-home" class="btn btn-text">
                    <i class="fas fa-arrow-left"></i> Volver
                </button>
                <button id="create-board" class="btn btn-primary">Crear</button>
            </div>
        </div>

        <!-- Categories -->
        <div id="categories-screen" class="screen">
            <h2>Categorías</h2>
            <div id="category-inputs"></div>
            <div class="actions">
                <button id="back-to-setup" class="btn btn-text">
                    <i class="fas fa-arrow-left"></i> Volver
                </button>
                <button id="submit-categories" class="btn btn-primary">Siguiente</button>
            </div>
        </div>

        <!-- Questions -->
        <div id="questions-screen" class="screen">
            <h2>Preguntas y Respuestas</h2>
            <div id="questions-container"></div>
            <div class="actions">
                <button id="back-to-categories" class="btn btn-text">
                    <i class="fas fa-arrow-left"></i> Volver
                </button>
                <button id="submit-questions" class="btn btn-primary">Finalizar</button>
            </div>
        </div>

        <!-- Lobby -->
        <div id="lobby-screen" class="screen">
            <h2>Sala de Espera</h2>
            <div class="room-code">
                <span>Código:</span>
                <strong id="room-code-display"></strong>
            </div>
            <p class="hint">Comparte este código para que otros se unan</p>
            <div id="lobby-players-list"></div>
            <div class="actions">
                <button id="back-to-questions" class="btn btn-text">
                    <i class="fas fa-arrow-left"></i> Volver
                </button>
                <button id="start-game-lobby" class="btn btn-primary">Iniciar</button>
            </div>
        </div>

        <!-- Game -->
        <div id="game-screen" class="screen">
            <div class="game-header">
                <h1>Jeopardy</h1>
                <button id="end-game" class="btn btn-danger">Finalizar</button>
            </div>
            <div id="game-board"></div>
            <div id="players-bar"></div>
        </div>

        <!-- Modal -->
        <div id="question-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h3 id="modal-category"></h3>
                <p id="modal-question"></p>
                <div class="modal-actions" id="answer-buttons">
                    <button id="btn-correct" class="btn btn-success">
                        <i class="fas fa-check"></i> Correcto
                    </button>
                    <button id="btn-incorrect" class="btn btn-danger">
                        <i class="fas fa-times"></i> Incorrecto
                    </button>
                </div>
                <div id="modal-answer" class="hidden">
                    <p class="answer-label">Respuesta:</p>
                    <p id="correct-answer-text"></p>
                </div>
            </div>
        </div>

        <!-- Results -->
        <div id="results-screen" class="screen">
            <h2>Resultados</h2>
            <div id="podium"></div>
            <button id="show-full-results" class="btn btn-secondary">Ver todos</button>
            <div id="full-results" class="hidden"></div>
            <button id="new-game" class="btn btn-primary">Nuevo Juego</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
